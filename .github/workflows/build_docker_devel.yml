name: "Obraz devel: Local Multi-Arch Build (Self-Contained)"

on:
  workflow_dispatch:

# =========================================================================
# JAWNA KONFIGURACJA SZABLONU - ZMIENNE ŚRODOWISKOWE
# =========================================================================
env:
  ORG_NAME: "algorone"              # Nazwa organizacji na GitHubie
  APP_NAME: "devel"              # Nazwa docelowego pakietu w GHCR (ghcr.io/algorone/devel)
  
  # Lokalna ścieżka do katalogu z plikami aplikacji i Dockerfile
  LOCAL_APP_PATH: "./dockers/devel"
# =========================================================================

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Wymagane dla GITHUB_TOKEN
    steps:
      # 1. Pobieramy zawartość naszego repozytorium
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Konfiguracja emulatorów dla architektury mieszanej (amd64 + arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Logowanie do rejestru organizacji GHCR za pomocą GITHUB_TOKEN
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Budowanie i wysyłka obrazu Multi-Arch
      # Kluczowe: jako 'context' i 'file' wskazujemy nasz lokalny podfolder aplikacji
      - name: Build and push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.LOCAL_APP_PATH }}
          file: ${{ env.LOCAL_APP_PATH }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.ORG_NAME }}/${{ env.APP_NAME }}:${{ github.sha }}
            ghcr.io/${{ env.ORG_NAME }}/${{ env.APP_NAME }}:latest
