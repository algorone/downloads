name: "Przegladarka dokumentow dla Windows"

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'nazwa budowanego serwisu'
        required: true
        default: 'przegladarka'      
      src_branch:
        description: 'nazwa brancha lub tagu do budowy w SRC_REPOSITORY'
        required: false
        default: 'main'

# =========================================================================
# KONFIGURACJA SZABLONU - TUTAJ DEFINIUJESZ ZMIENNE DLA NOWEJ APLIKACJI
# =========================================================================
env:
  ORG_NAME: "algorone"       
  APP_NAME: "${{ inputs.app_name }}"
  
  # Repozytorium z kodem źródłowym (Monorepo)
  SRC_REPOSITORY: "algorone/algorek"  
  SRC_BRANCH: "${{ inputs.src_branch }}"               
  SRC_COMPONENT_PATH: "source-repo/${{ inputs.app_name }}/gui"    
# =========================================================================

jobs:
  build-windows-dist:
    runs-on: windows-latest 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout remote apps monorepo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SRC_REPOSITORY }}
          ref: ${{ env.SRC_BRANCH }}
          path: 'source-repo'

      - name: Setup Node.js (do samego procesu budowania)
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ env.SRC_COMPONENT_PATH }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.SRC_COMPONENT_PATH }}
        run: npm ci --verbose

      - name: Build Next.js application
        working-directory: ${{ env.SRC_COMPONENT_PATH }}
        run: npm run build

      - name: Prepare Windows Package
        working-directory: ${{ env.SRC_COMPONENT_PATH }}
        shell: bash
        run: |
          # Tworzymy ostateczną strukturę katalogu
          mkdir -p dist-windows
          cp -r .next/standalone/. dist-windows/
          cp -r public dist-windows/public
          cp -r .next/static dist-windows/.next/static

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP_NAME }}-windows-dist
          path: ${{ env.SRC_COMPONENT_PATH }}/dist-windows

